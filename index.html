<!DOCTYPE html>
<html lang="bn">
<head>

<script data-cfasync="false" src="https://benchform.org/1/0cdc31555228b5956e874a3f39540937"></script>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>Premium Video Hub</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: radial-gradient(circle at top, #181818 0%, #080808 38%, #000000 100%);
            color: #ffffff;
            font-family: 'Inter', Arial, sans-serif;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 760px;
            margin: auto;
            min-height: 100vh;
            background: linear-gradient(180deg, #090909 0%, #020202 100%);
            box-shadow: 0 0 100px rgba(0,0,0,.8);
        }

        /* TOP BAR */
        .topbar {
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            position: sticky;
            top: 0;
            z-index: 500;
            background: rgba(5,5,5,.88);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: linear-gradient(135deg, #ff164f, #ff7438);
            box-shadow: 0 0 25px rgba(255,45,90,.35);
        }

        .premium-badge {
            padding: 6px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .7px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.1);
            color: #ff8e9f;
        }

        /* PLAYER */
        .player-section {
            padding: 16px 12px 0;
        }

        .player {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 25px 70px rgba(0,0,0,.8);
            cursor: pointer;
        }

        .player::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 20px;
            background: linear-gradient(120deg, rgba(255,30,90,.35), transparent 30%, transparent 70%, rgba(255,100,50,.25));
            pointer-events: none;
            z-index: 1;
        }

        .player-thumbnail {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .72;
            filter: brightness(.55) contrast(1.08);
            transform: scale(1.01);
            transition: transform .5s ease, filter .5s ease;
        }

        .player:hover .player-thumbnail {
            transform: scale(1.04);
            filter: brightness(.65) contrast(1.08);
        }

        .player-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,.15), transparent 30%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.95) 100%);
            z-index: 2;
        }

        .center-play {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 78px;
            height: 78px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.35);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 0 10px rgba(255,255,255,.03), 0 0 45px rgba(255,30,90,.35);
            z-index: 4;
            transition: transform .25s ease, background .25s ease;
        }

        .center-play i {
            font-size: 29px;
            margin-left: 4px;
            color: white;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
        }

        .player:hover .center-play {
            transform: translate(-50%,-50%) scale(1.08);
            background: rgba(255,40,90,.25);
        }

        .player-top {
            position: absolute;
            top: 14px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 11px;
            border-radius: 30px;
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,.12);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff315c;
            box-shadow: 0 0 10px #ff315c;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: .35; transform: scale(.75); }
        }

        .quality {
            padding: 7px 10px;
            border-radius: 7px;
            background: rgba(0,0,0,.55);
            border: 1px solid rgba(255,255,255,.1);
            font-size: 10px;
            font-weight: 800;
        }

        .player-bottom {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 13px;
            z-index: 5;
        }

        .loading-line {
            height: 3px;
            width: 100%;
            background: rgba(255,255,255,.18);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 11px;
        }

        .loading-line span {
            display: block;
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, #ff174f, #ff7542);
            border-radius: inherit;
            animation: loadingMove 2.5s ease-in-out infinite;
        }

        @keyframes loadingMove {
            0% { width: 10%; }
            50% { width: 75%; }
            100% { width: 10%; }
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #eee;
            font-size: 12px;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .control-icon {
            font-size: 13px;
            opacity: .9;
        }

        /* VIDEO INFO */
        .video-info-main {
            padding: 17px 15px 18px;
        }

        .video-title-main {
            font-size: 20px;
            line-height: 1.35;
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .video-subtitle {
            color: #8f8f8f;
            font-size: 12px;
            margin-top: 7px;
        }

        .watch-hint {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 13px;
            border-radius: 12px;
            background: rgba(255,35,85,.08);
            border: 1px solid rgba(255,50,100,.14);
            color: #ff9caf;
            font-size: 12px;
            font-weight: 600;
            transition: all .3s ease;
        }

        .watch-hint i {
            color: #ff3c69;
        }

        .watch-hint.unlock-state {
            background: rgba(168,85,247,.1);
            border-color: rgba(168,85,247,.3);
            color: #c084fc;
        }

        .watch-hint.unlock-state i {
            color: #a855f7;
        }

        /* SECTION */
        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 14px;
        }

        .section-head h2 {
            font-size: 17px;
            font-weight: 800;
        }

        .section-head span {
            color: #777;
            font-size: 11px;
        }

        /* SEARCH */
        .search-wrapper {
            padding: 0 15px 15px;
        }

        .search {
            position: relative;
        }

        .search input {
            width: 100%;
            height: 44px;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,.08);
            outline: none;
            background: rgba(255,255,255,.05);
            color: white;
            padding: 0 15px 0 43px;
            font-size: 13px;
        }

        .search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 14px;
        }

        /* VIDEO GRID */
        .video-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 12px 30px;
        }

        .video-card {
            position: relative;
            background: #0b0b0d;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.08);
            transition: transform .2s ease, border-color .2s ease;
        }

        .video-card:hover {
            border-color: rgba(255,65,100,.4);
        }

        .thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: #111;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s ease;
        }

        .video-card:hover .thumb img {
            transform: scale(1.05);
        }

        .thumb-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.15);
        }

        .mini-play {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,.65);
            border: 1px solid rgba(255,255,255,.25);
            backdrop-filter: blur(8px);
        }

        .mini-play i {
            font-size: 14px;
            margin-left: 2px;
        }

        .card-info {
            padding: 10px 10px 11px;
        }

        .card-title {
            font-size: 12px;
            line-height: 1.4;
            font-weight: 700;
            color: #e8e8e8;
            min-height: 34px;
        }

        /* WATCH BUTTON */
        .watch-small {
            margin-top: 8px;
            width: 100%;
            border: none;
            border-radius: 8px;
            height: 38px;
            background: linear-gradient(100deg, #ff174f, #ff713d);
            color: white;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,30,80,.18);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all .25s ease;
            letter-spacing: .2px;
        }

        .watch-small:active {
            transform: scale(.97);
        }

        .watch-small.state-watch {
            background: linear-gradient(100deg, #ff174f, #ff713d);
            box-shadow: 0 5px 15px rgba(255,30,80,.18);
        }

        .watch-small.state-unlock {
            background: linear-gradient(100deg, #16a34a, #22c55e);
            box-shadow: 0 5px 15px rgba(34,197,94,.3);
            animation: unlockPulse 1.5s ease-in-out infinite;
        }

        @keyframes unlockPulse {
            0%, 100% { box-shadow: 0 5px 15px rgba(34,197,94,.3); }
            50% { box-shadow: 0 5px 25px rgba(34,197,94,.6); }
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        /* LOADING */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0,0,0,.9);
            backdrop-filter: blur(18px);
        }

        .loading-overlay.show {
            display: flex;
        }

        .loader-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.12);
            border-top-color: #ff315e;
            border-right-color: #ff743d;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-title {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 700;
        }

        .loading-sub {
            margin-top: 7px;
            color: #777;
            font-size: 11px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%) translateY(120px);
            width: calc(100% - 30px);
            max-width: 500px;
            padding: 13px 15px;
            border-radius: 14px;
            background: rgba(17,17,17,.96);
            border: 1px solid rgba(56,228,123,.35);
            box-shadow: 0 15px 50px rgba(0,0,0,.6);
            z-index: 10000;
            opacity: 0;
            transition: all .35s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            color: #38e47b;
            font-size: 18px;
        }

        .toast-text {
            font-size: 12px;
            line-height: 1.5;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 10px;
            border-top: 1px solid rgba(255,255,255,.05);
        }

        @media (max-width: 430px) {
            .video-title-main { font-size: 18px; }
            .center-play { width: 68px; height: 68px; }
            .center-play i { font-size: 25px; }
            .video-container { gap: 10px; }
        }

        @media (min-width: 650px) {
            .video-container { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

<script>
    /* =========================================================
       ✅ আপনার তিনটি রাউন্ড-রবিন লিংক
    ========================================================== */
    const REDIRECT_LINKS = [
        "https://otieu.com/4/9429975",
        "https://omg10.com/4/9446627",
        "https://omg10.com/4/9717825"
    ];

    let globalLinkIndex = 0;

    /* =========================================================
       ৩৫টি ছবি
    ========================================================== */
    const imageUrls = [
        "https://i.ibb.co.com/hkj2p0T/1790521518749.jpg",
        "https://i.ibb.co.com/rf1BzbgP/IMG-20260927-200855-474.jpg",

    const videos = imageUrls.map((url, i) => ({
        title: `Premium Exclusive Video ${String(i + 1).padStart(2, '0')}`,
        image: url
    }));

    /* =========================================================
       ELEMENTS
    ========================================================== */
    const videoContainer = document.getElementById("videoContainer");
    const videoCount = document.getElementById("videoCount");
    const mainPlayer = document.getElementById("mainPlayer");
    const mainThumbnail = document.getElementById("mainThumbnail");
    const heroPlayIcon = document.getElementById("heroPlayIcon");
    const heroHint = document.getElementById("heroHint");

    const loadingOverlay = document.getElementById("loadingOverlay");
    const toast = document.getElementById("toast");
    const toastText = document.getElementById("toastText");

    /* =========================================================
       STATE
    ========================================================== */
    let heroState = "watch";
    let isProcessing = false;

    /* =========================================================
       ✅✅✅ MULTI-METHOD REDIRECT ✅✅✅
       ৭টি পদ্ধতি চেষ্টা করবে — যেটা কাজ করবে সেটাই হবে
    ========================================================== */
    function openNextLink() {
        const currentLink = REDIRECT_LINKS[globalLinkIndex % REDIRECT_LINKS.length];
        globalLinkIndex++;

        console.log("➡️ Target:", currentLink);

        // পদ্ধতি ১: Telegram WebApp
        try {
            if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.openLink === "function") {
                window.Telegram.WebApp.openLink(currentLink);
                console.log("✅ Method 1: Telegram.openLink");
                return;
            }
        } catch (e) { console.warn("M1 fail:", e); }

        // পদ্ধতি ২: window.open নতুন ট্যাবে
        try {
            const w = window.open(currentLink, "_blank", "noopener,noreferrer");
            if (w && !w.closed) {
                console.log("✅ Method 2: window.open");
                return;
            }
        } catch (e) { console.warn("M2 fail:", e); }

        // পদ্ধতি ৩: window.top.location (iframe থেকে বের)
        try {
            if (window.top && window.top !== window.self) {
                window.top.location.href = currentLink;
                console.log("✅ Method 3: window.top.location");
                return;
            }
        } catch (e) { console.warn("M3 fail:", e); }

        // পদ্ধতি ৪: window.parent.location
        try {
            if (window.parent && window.parent !== window.self) {
                window.parent.location.href = currentLink;
                console.log("✅ Method 4: window.parent.location");
                return;
            }
        } catch (e) { console.warn("M4 fail:", e); }

        // পদ্ধতি ৫: window.location.href
        try {
            window.location.href = currentLink;
            console.log("✅ Method 5: window.location.href");
            return;
        } catch (e) { console.warn("M5 fail:", e); }

        // পদ্ধতি ৬: location.replace
        try {
            window.location.replace(currentLink);
            console.log("✅ Method 6: location.replace");
            return;
        } catch (e) { console.warn("M6 fail:", e); }

        // পদ্ধতি ৭: Anchor click (শেষ উপায়)
        try {
            const a = document.createElement("a");
            a.href = currentLink;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.style.display = "none";
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                if (a.parentNode) document.body.removeChild(a);
            }, 100);
            console.log("✅ Method 7: anchor click");
        } catch (e) {
            console.error("❌ All methods failed:", e);
        }
    }

    /* =========================================================
       TOAST
    ========================================================== */
    function showToast(message, icon = "fa-circle-check", color = "#38e47b") {
        toastText.textContent = message;
        const iconEl = toast.querySelector("i");
        iconEl.className = `fa-solid ${icon}`;
        iconEl.style.color = color;
        toast.style.borderColor = color + "55";

        toast.classList.add("show");
        setTimeout(() => {
            toast.classList.remove("show");
        }, 3500);
    }

    /* =========================================================
       LOADING
    ========================================================== */
    function showLoading(text = "Loading...") {
        loadingOverlay.querySelector(".loading-title").textContent = text;
        loadingOverlay.classList.add("show");
    }

    function hideLoading() {
        loadingOverlay.classList.remove("show");
    }

    /* =========================================================
       HERO STATE
    ========================================================== */
    function updateHeroState() {
        if (heroState === "watch") {
            heroPlayIcon.className = "fa-solid fa-play";
            heroHint.classList.remove("unlock-state");
            heroHint.querySelector("span").textContent = "ভিডিও দেখতে ক্লিক করুন";
        } else if (heroState === "unlock") {
            heroPlayIcon.className = "fa-solid fa-lock-open";
            heroHint.classList.add("unlock-state");
            heroHint.querySelector("span").textContent = "🔓 এখন আনলক করতে ক্লিক করুন";
        }
    }

    /* =========================================================
       CARD BUTTON STATE
    ========================================================== */
    function updateCardButton(btn, state) {
        if (state === "watch") {
            btn.className = "watch-small state-watch";
            btn.innerHTML = '<i class="fa-solid fa-play"></i> ভিডিও দেখুন';
            btn.dataset.state = "watch";
        } else if (state === "unlock") {
            btn.className = "watch-small state-unlock";
            btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> আনলক ভিডিও';
            btn.dataset.state = "unlock";
        }
    }

    /* =========================================================
       PAGE RETURN HANDLER
       ইউজার লিংক থেকে ফিরে এলে স্টেট আপডেট হবে
    ========================================================== */
    let pendingAction = null;

    function handlePageReturn() {
        if (pendingAction) {
            const action = pendingAction;
            pendingAction = null;
            setTimeout(() => {
                action();
                isProcessing = false;
                hideLoading();
            }, 200);
        }
    }

    document.addEventListener("visibilitychange", function () {
        if (!document.hidden) handlePageReturn();
    });

    window.addEventListener("focus", handlePageReturn);

    window.addEventListener("pageshow", function (e) {
        if (e.persisted) {
            handlePageReturn();
        }
    });

    /* =========================================================
       HERO CLICK
    ========================================================== */
    mainPlayer.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();

        if (isProcessing) return;
        isProcessing = true;

        if (heroState === "watch") {
            pendingAction = function () {
                heroState = "unlock";
                updateHeroState();
                showToast("ভিডিও দেখার জন্য ধন্যবাদ! এখন আনলক করুন।", "fa-lock-open", "#a855f7");
            };
            openNextLink();
        } else if (heroState === "unlock") {
            pendingAction = function () {
                heroState = "watch";
                updateHeroState();
                showToast("✅ আনলক সম্পন্ন! আবার ভিডিও দেখতে ক্লিক করুন।", "fa-circle-check", "#22c55e");
            };
            openNextLink();
        }
    });

    /* =========================================================
       BUILD VIDEO CARDS
    ========================================================== */
    function buildVideos(list) {
        videoContainer.innerHTML = "";
        videoCount.textContent = list.length + " Videos";

        if (list.length === 0) {
            videoContainer.innerHTML = `
                <div class="no-results">
                    <i class="fa-solid fa-video-slash" style="font-size:36px;margin-bottom:12px;"></i>
                    <p>কোনো ভিডিও পাওয়া যায়নি</p>
                </div>
            `;
            return;
        }

        list.forEach(function (video) {
            const card = document.createElement("div");
            card.className = "video-card";
            card.dataset.title = video.title.toLowerCase();

            card.innerHTML = `
                <div class="thumb">
                    <img src="${video.image}" alt="${video.title}" loading="lazy">
                    <div class="thumb-overlay">
                        <div class="mini-play"><i class="fa-solid fa-play"></i></div>
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-title">${video.title}</div>
                    <button class="watch-small state-watch" data-state="watch">
                        <i class="fa-solid fa-play"></i> ভিডিও দেখুন
                    </button>
                </div>
            `;

            const watchBtn = card.querySelector(".watch-small");

            card.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();

                if (isProcessing) return;
                isProcessing = true;

                const state = watchBtn.dataset.state;
                mainThumbnail.src = video.image;

                if (state === "watch") {
                    pendingAction = function () {
                        updateCardButton(watchBtn, "unlock");
                        showToast("ভিডিও দেখার জন্য ধন্যবাদ! এখন আনলক করুন।", "fa-lock-open", "#a855f7");
                    };
                    openNextLink();
                } else if (state === "unlock") {
                    pendingAction = function () {
                        updateCardButton(watchBtn, "watch");
                        showToast("✅ আনলক সম্পন্ন! আবার ভিডিও দেখতে ক্লিক করুন।", "fa-circle-check", "#22c55e");
                    };
                    openNextLink();
                }
            });

            videoContainer.appendChild(card);
        });
    }

    /* =========================================================
       SEARCH
    ========================================================== */
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("input", function () {
        const keyword = this.value.toLowerCase().trim();
        const filtered = videos.filter(v => v.title.toLowerCase().includes(keyword));
        buildVideos(filtered);
    });

    /* =========================================================
       INIT
    ========================================================== */
    buildVideos(videos);
    updateHeroState();
    hideLoading();

    console.log("✅ Premium Video Hub loaded");
    console.log("📋 Links:", REDIRECT_LINKS);
</script>

</body>
</html>
